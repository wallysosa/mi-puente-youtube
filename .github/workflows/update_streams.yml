name: Actualizar Streams Latinos

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar yt-dlp
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Generar canales.json
        run: |
          python3 - << 'PYEOF'
          import subprocess, json

          def get_url(yt_url):
              try:
                  r = subprocess.run(
                      ['yt-dlp', '-g', '--no-warnings', yt_url],
                      capture_output=True, text=True, timeout=30
                  )
                  url = r.stdout.strip().split('\n')[0]
                  return url if url.startswith('http') else ''
              except:
                  return ''

          fuentes = [
              {"nombre": "TN - Todo Noticias", "pais": "AR", "grupo": "Argentina", "logo": "https://graph.facebook.com/todonoticias/picture?width=200&height=200", "stream": "https://dai.google.com/linear/hls/event/5OEEtA9FR-yrvhNE5K8PQQ/master.m3u8"},
              {"nombre": "C5N",                "pais": "AR", "grupo": "Argentina", "logo": "https://yt3.googleusercontent.com/ytc/AIdro_nQ5B7sMG1YfwFpRlM_d_8b3U5GBCiNUYhqBdV9=s176-c-k-c0x00ffffff-no-rj", "youtube_live": "https://www.youtube.com/@c5n/live"},
              {"nombre": "TV Publica",          "pais": "AR", "grupo": "Argentina", "logo": "https://graph.facebook.com/TVPublicaArgentina/picture?width=200&height=200", "youtube_live": "https://www.youtube.com/@TVPublicaArgentina/live"},
              {"nombre": "Canal 26",            "pais": "AR", "grupo": "Argentina", "logo": "https://graph.facebook.com/canal26noticias/picture?width=200&height=200", "youtube_live": "https://www.youtube.com/@canal26/live"},
              {"nombre": "America TV",          "pais": "AR", "grupo": "Argentina", "logo": "https://graph.facebook.com/americaenvivo/picture?width=200&height=200", "youtube_live": "https://www.youtube.com/@americaenvivo/live"},
              {"nombre": "Radio Mitre",         "pais": "AR", "grupo": "Argentina", "logo": "https://graph.facebook.com/Radiomitre/picture?width=200&height=200", "youtube_live": "https://www.youtube.com/@Radiomitre/live"},
              {"nombre": "Azteca 7",            "pais": "MX", "grupo": "Mexico",    "logo": "https://graph.facebook.com/aztecasiete/picture?width=200&height=200", "stream": "https://dai.google.com/linear/hls/event/YHoOj51dSKCvBQOBG2OvLQ/master.m3u8"},
              {"nombre": "a mas",               "pais": "MX", "grupo": "Mexico",    "logo": "https://graph.facebook.com/amastv/picture?width=200&height=200", "stream": "https://dai.google.com/linear/hls/event/SJysMl45QMSwjo0TodSk1Q/master.m3u8"},
              {"nombre": "DW Espanol",          "pais": "DE", "grupo": "Internacional", "logo": "https://graph.facebook.com/dw.espanol/picture?width=200&height=200", "stream": "https://dwamdstream104.akamaized.net/hls/live/2015530/dwstream104/stream04/streamPlaylist.m3u8"},
              {"nombre": "NHK World",           "pais": "JP", "grupo": "Internacional", "logo": "https://graph.facebook.com/NHKWorldTV/picture?width=200&height=200", "stream": "https://nhkwlive-ojp.akamaized.net/hls/live/2003459/nhkwlive-ojp-en/index_1M.m3u8"},
          ]

          resultado = []
          for c in fuentes:
              if 'youtube_live' in c:
                  print(f"Extrayendo {c['nombre']}...")
                  url = get_url(c['youtube_live'])
                  print(f"  -> {'OK' if url else 'FALLO'}")
              else:
                  url = c['stream']
              resultado.append({
                  "nombre": c['nombre'],
                  "pais":   c['pais'],
                  "grupo":  c['grupo'],
                  "logo":   c['logo'],
                  "stream": url
              })

          with open('canales.json', 'w') as f:
              json.dump(resultado, f, ensure_ascii=False, indent=2)

          print(f"JSON generado con {len(resultado)} canales")
          PYEOF

      - name: Subir a rama streams
        run: |
          git init
          git config --local user.name "actions"
          git config --local user.email "action@github.com"
          git checkout -b streams
          git add canales.json
          git commit -m "Actualizar streams $(date -u '+%Y-%m-%d %H:%M UTC')"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin streams
