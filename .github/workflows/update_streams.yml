name: Actualizar Streams Latinos

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar yt-dlp
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: TN Todo Noticias
        run: yt-dlp -g --no-warnings https://www.youtube.com/@todonoticias/live > ./tn.txt || echo "" > ./tn.txt

      - name: C5N
        run: yt-dlp -g --no-warnings https://www.youtube.com/@c5n/live > ./c5n.txt || echo "" > ./c5n.txt

      - name: TV Publica
        run: yt-dlp -g --no-warnings https://www.youtube.com/@TVPublicaArgentina/live > ./tvpublica.txt || echo "" > ./tvpublica.txt

      - name: Canal 26
        run: yt-dlp -g --no-warnings https://www.youtube.com/@canal26/live > ./canal26.txt || echo "" > ./canal26.txt

      - name: America TV
        run: yt-dlp -g --no-warnings https://www.youtube.com/@americaenvivo/live > ./america.txt || echo "" > ./america.txt

      - name: Radio Mitre
        run: yt-dlp -g --no-warnings https://www.youtube.com/@Radiomitre/live > ./radiomitre.txt || echo "" > ./radiomitre.txt

      - name: Cronica TV
        run: yt-dlp -g --no-warnings https://www.youtube.com/@cronicatv/live > ./cronica.txt || echo "" > ./cronica.txt

      - name: A24
        run: yt-dlp -g --no-warnings https://www.youtube.com/@A24com/live > ./a24.txt || echo "" > ./a24.txt

      - name: El Doce
        run: yt-dlp -g --no-warnings https://www.youtube.com/@eldoce/live > ./eldoce.txt || echo "" > ./eldoce.txt

      - name: Generar canales.m3u
        run: |
          TN=$(cat ./tn.txt)
          C5N=$(cat ./c5n.txt)
          TVPUB=$(cat ./tvpublica.txt)
          C26=$(cat ./canal26.txt)
          AMER=$(cat ./america.txt)
          MITRE=$(cat ./radiomitre.txt)
          CRON=$(cat ./cronica.txt)
          A24=$(cat ./a24.txt)
          DOCE=$(cat ./eldoce.txt)
          printf '%s\n' \
            '#EXTM3U' \
            '#EXTINF:-1 tvg-logo="https://graph.facebook.com/todonoticias/picture?width=200&height=200" tvg-country="AR" group-title="Argentina", TN - Todo Noticias' \
            '#EXTVLCOPT:http-user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36' \
            "$TN" \
            '#EXTINF:-1 tvg-logo="https://yt3.googleusercontent.com/ytc/AIdro_nQ5B7sMG1YfwFpRlM_d_8b3U5GBCiNUYhqBdV9=s176-c-k-c0x00ffffff-no-rj" tvg-country="AR" group-title="Argentina", C5N' \
            '#EXTVLCOPT:http-user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36' \
            "$C5N" \
            '#EXTINF:-1 tvg-logo="https://graph.facebook.com/TVPublicaArgentina/picture?width=200&height=200" tvg-country="AR" group-title="Argentina", TV Publica' \
            '#EXTVLCOPT:http-user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36' \
            "$TVPUB" \
            '#EXTINF:-1 tvg-logo="https://graph.facebook.com/canal26noticias/picture?width=200&height=200" tvg-country="AR" group-title="Argentina", Canal 26' \
            '#EXTVLCOPT:http-user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36' \
            "$C26" \
            '#EXTINF:-1 tvg-logo="https://graph.facebook.com/americaenvivo/picture?width=200&height=200" tvg-country="AR" group-title="Argentina", America TV' \
            '#EXTVLCOPT:http-user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36' \
            "$AMER" \
            '#EXTINF:-1 tvg-logo="https://graph.facebook.com/Radiomitre/picture?width=200&height=200" tvg-country="AR" group-title="Argentina", Radio Mitre' \
            '#EXTVLCOPT:http-user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36' \
            "$MITRE" \
            '#EXTINF:-1 tvg-logo="https://graph.facebook.com/cronicatv/picture?width=200&height=200" tvg-country="AR" group-title="Argentina", Cronica TV' \
            '#EXTVLCOPT:http-user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36' \
            "$CRON" \
            '#EXTINF:-1 tvg-logo="https://graph.facebook.com/A24com/picture?width=200&height=200" tvg-country="AR" group-title="Argentina", A24' \
            '#EXTVLCOPT:http-user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36' \
            "$A24" \
            '#EXTINF:-1 tvg-logo="https://graph.facebook.com/eldoce/picture?width=200&height=200" tvg-country="AR" group-title="Argentina", El Doce' \
            '#EXTVLCOPT:http-user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36' \
            "$DOCE" \
            '#EXTINF:-1 tvg-logo="https://graph.facebook.com/aztecasiete/picture?width=200&height=200" tvg-country="MX" group-title="Mexico", Azteca 7' \
            '#EXTVLCOPT:http-user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36' \
            'https://dai.google.com/linear/hls/event/YHoOj51dSKCvBQOBG2OvLQ/master.m3u8' \
            '#EXTINF:-1 tvg-logo="https://graph.facebook.com/dw.espanol/picture?width=200&height=200" tvg-country="DE" group-title="Internacional", DW Espanol' \
            '#EXTVLCOPT:http-user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36' \
            'https://dwamdstream104.akamaized.net/hls/live/2015530/dwstream104/stream04/streamPlaylist.m3u8' \
            '#EXTINF:-1 tvg-logo="https://graph.facebook.com/NHKWorldTV/picture?width=200&height=200" tvg-country="JP" group-title="Internacional", NHK World' \
            '#EXTVLCOPT:http-user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36' \
            'https://nhkwlive-ojp.akamaized.net/hls/live/2003459/nhkwlive-ojp-en/index_1M.m3u8' \
          > canales.m3u

      - name: Subir a rama streams
        run: |
          git init
          git config --local user.name "actions"
          git config --local user.email "action@github.com"
          git checkout -b streams
          git add canales.m3u
          git commit -m "Actualizar streams $(date -u '+%Y-%m-%d %H:%M UTC')"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin streams
